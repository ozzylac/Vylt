# cargo-deny policy for Vylt (Windows build only).
# Run: cargo deny check

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities and unmaintained crates in the Windows dependency graph fail the check.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots bundles the Mozilla CA list under this permissive data licence.
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # Fonts bundled by egui (embedding allowed):
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
